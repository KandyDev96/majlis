<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>Majlis — Auth Flow</title>
<link rel="stylesheet" href="../../colors_and_type.css">
<style>
  /* Mobile screen base — fills the iPhone safe-area below the status bar */
  .scr { width: 100%; height: 100%; background: var(--bg); color: var(--fg); position: relative; overflow: hidden; font-family: var(--font-sans); }
  .scr-pad { padding: 32px 24px 24px; height: 100%; box-sizing: border-box; display: flex; flex-direction: column; }

  /* Hero gradient + geometric pattern (splash + login) */
  .hero {
    background: linear-gradient(160deg, var(--brand-800) 0%, var(--brand-600) 60%, var(--brand-700) 100%);
    color: #fff; position: relative; overflow: hidden;
  }
  .hero::before {
    content: ""; position: absolute; inset: 0;
    background-image: url("../../assets/pattern-geometric.svg");
    background-size: 220px; background-repeat: repeat;
    opacity: 0.07; filter: invert(1) brightness(2);
  }
  .hero > * { position: relative; }

  /* Buttons */
  .btn { font: 700 16px/1 var(--font-sans); border: 0; padding: 16px 22px; border-radius: 14px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px; width: 100%; box-sizing: border-box; transition: transform .12s var(--ease-out), background .18s; }
  .btn:active { transform: scale(0.98); }
  .btn-primary { background: var(--brand); color: #fff; box-shadow: var(--shadow-brand); }
  .btn-primary:hover { background: var(--brand-hover); }
  .btn-secondary { background: var(--surface-2); color: var(--fg); border:1px solid var(--border); }
  .btn-ghost { background: transparent; color: var(--brand); font-weight: 500; }
  .btn-disabled { background: var(--neutral-200); color: var(--neutral-400); cursor: not-allowed; }

  /* Fields */
  .field { display: flex; flex-direction: column; gap: 6px; }
  .field label { font: 500 13px/1 var(--font-sans); color: var(--fg-muted); }
  .input-wrap { position: relative; }
  .input { font: 500 16px/1 var(--font-sans); background: var(--surface-2); border:1.5px solid transparent; border-radius: 14px; padding: 14px 16px 14px 44px; color: var(--fg); width: 100%; box-sizing: border-box; }
  .input::placeholder { color: var(--fg-faint); font-weight: 400; }
  .input:focus { background: var(--surface); border-color: var(--brand); box-shadow: var(--focus-ring); outline: none; }
  .input-wrap .ico { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--fg-muted); pointer-events: none; }
  .input.error { background: var(--danger-bg); border-color: var(--danger); }

  /* Select & checkbox */
  .select { font: 500 16px/1 var(--font-sans); background: var(--surface-2); border:1.5px solid transparent; border-radius: 14px; padding: 14px 16px; color: var(--fg); width: 100%; appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--fg-muted) 50%), linear-gradient(135deg, var(--fg-muted) 50%, transparent 50%); background-position: calc(0% + 14px) center, calc(0% + 19px) center; background-size: 5px 5px; background-repeat: no-repeat; box-sizing: border-box; }
  .check { display: flex; align-items: center; gap: 8px; font: 500 14px/1 var(--font-sans); cursor: pointer; }
  .check input { width: 18px; height: 18px; accent-color: var(--brand); }

  /* Chips */
  .chips { display: flex; gap: 8px; flex-wrap: wrap; }
  .chip { font: 500 14px/1 var(--font-sans); padding: 10px 14px; border-radius: 999px; background: var(--surface-2); color: var(--fg); border:1px solid var(--border-soft); display: inline-flex; align-items: center; gap: 6px; cursor: pointer; transition: all .15s; }
  .chip.selected { background: var(--brand); color: #fff; border-color: var(--brand); }
  .chip-add { border-style: dashed; color: var(--brand); }
  .chip-remove { color: var(--danger); margin-right: 2px; opacity: 0.7; }

  /* Step indicator */
  .steps { display: flex; gap: 6px; align-items: center; justify-content: space-between; padding: 0; }
  .step { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; position: relative; }
  .step-dot { width: 30px; height: 30px; border-radius: 50%; background: var(--surface-2); color: var(--fg-muted); display: flex; align-items: center; justify-content: center; font: 700 13px/1 var(--font-sans); flex-shrink: 0; border: 1.5px solid var(--border); }
  .step.active .step-dot { background: var(--brand); color: #fff; border-color: var(--brand); }
  .step.done .step-dot { background: var(--brand-100); color: var(--brand-700); border-color: var(--brand-100); }
  .step-label { font: 500 11px/1.2 var(--font-sans); color: var(--fg-muted); text-align: center; }
  .step.active .step-label { color: var(--fg); font-weight: 700; }
  .step-line { position: absolute; top: 15px; right: 50%; left: -50%; height: 1.5px; background: var(--border); z-index: -1; }
  .step:first-child .step-line { display: none; }
  .step.done .step-line, .step.active .step-line { background: var(--brand-300); }

  /* Card holding form */
  .form-card { background: var(--surface); border-radius: 24px; padding: 20px; box-shadow: var(--shadow-sm); display: flex; flex-direction: column; gap: 14px; }

  /* Splash specifics */
  .splash-logo { width: 168px; height: 168px; display: flex; align-items: center; justify-content: center; }
  .splash-wordmark { font: 900 76px/1 var(--font-sans); color: #fff; letter-spacing: -2px; }
  .splash-tagline { font: 500 18px/1.3 var(--font-sans); color: rgba(255,255,255,0.78); }
  .splash-ayah { font: 500 17px/1.6 var(--font-sans); color: var(--gold-200); border-right: 2px solid var(--gold); padding-right: 14px; max-width: 280px; text-align: right; }
  .splash-bar { height: 4px; background: rgba(255,255,255,0.12); border-radius: 999px; overflow: hidden; }
  .splash-bar > div { height: 100%; background: linear-gradient(90deg, var(--gold-300), var(--gold), var(--gold-300)); border-radius: 999px; width: 60%; animation: load 1.8s ease-in-out infinite; }
  @keyframes load { 0% { transform: translateX(100%); } 100% { transform: translateX(-160%); } }

  /* Success specifics */
  .check-circle { width: 120px; height: 120px; border-radius: 50%; background: linear-gradient(135deg, var(--brand-500), var(--brand-700)); display: flex; align-items: center; justify-content: center; box-shadow: var(--shadow-brand); position: relative; }
  .check-circle::after { content: ""; position: absolute; inset: -12px; border-radius: 50%; border: 2px solid var(--brand-200); opacity: 0.5; }

  /* Helpers */
  .stack { display: flex; flex-direction: column; }
  .stack > * + * { margin-top: var(--gap, 16px); }
  .row { display: flex; gap: 12px; }
  .grow { flex: 1; }
  .muted { color: var(--fg-muted); }
  .center { display: flex; align-items: center; justify-content: center; text-align: center; }
  .between { display: flex; align-items: center; justify-content: space-between; }
  .gap-12 > * + * { margin-top: 12px; }
  .gap-16 > * + * { margin-top: 16px; }
  .gap-20 > * + * { margin-top: 20px; }
  .gap-24 > * + * { margin-top: 24px; }
  .link { color: var(--brand); font-weight: 500; cursor: pointer; }

  /* Login wordmark inside light area */
  .login-mark { color: var(--brand); margin-bottom: 16px; }
  .login-mark .wm { font: 900 56px/1 var(--font-sans); letter-spacing: -1.5px; }

  /* Canvas styling */
  body { margin: 0; background: var(--bg-sunken); }
</style>
</head>

// Tiny icon set — line, 1.75 stroke, 24px
const Icon = ({ name, size = 20, color = "currentColor" }) => {
  const stroke = { stroke: color, strokeWidth: 1.75, strokeLinecap: "round", strokeLinejoin: "round", fill: "none" };
  const paths = {
    user: <><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-7 8-7s8 3 8 7"/></>,
    lock: <><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></>,
    code: <><path d="M8 7l-5 5 5 5"/><path d="M16 7l5 5-5 5"/><path d="M14 4l-4 16"/></>,
    eye: <><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></>,
    phone: <><path d="M4 5c0-1 1-2 2-2h2l2 5-2 1c1 2 3 4 5 5l1-2 5 2v2c0 1-1 2-2 2C9 18 6 15 4 5z"/></>,
    check: <path d="M5 12l5 5L20 7"/>,
    chevron: <path d="M9 6l6 6-6 6"/>,
    chevronLeft: <path d="M15 6l-6 6 6 6"/>,
    plus: <><path d="M12 5v14"/><path d="M5 12h14"/></>,
    trash: <><path d="M4 7h16"/><path d="M9 7V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2"/><path d="M6 7l1 13a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-13"/></>,
    mapPin: <><path d="M12 22s8-7 8-13a8 8 0 1 0-16 0c0 6 8 13 8 13z"/><circle cx="12" cy="9" r="3"/></>,
    home: <><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></>,
    file: <><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6"/></>,
    briefcase: <><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></>,
  };
  return <svg width={size} height={size} viewBox="0 0 24 24" style={stroke}>{paths[name]}</svg>;
};

// Step header
const StepHeader = ({ current }) => {
  const steps = [
    { n: 1, label: "الأساسية" },
    { n: 2, label: "الشخصية" },
    { n: 3, label: "العمل" },
    { n: 4, label: "السكن" },
  ];
  return (
    <div className="steps">
      {steps.map(s => {
        const state = s.n < current ? "done" : s.n === current ? "active" : "";
        return (
          <div key={s.n} className={"step " + state}>
            <span className="step-line"></span>
            <span className="step-dot">{s.n < current ? <Icon name="check" size={14} color="#0E4C3A"/> : s.n}</span>
            <span className="step-label">{s.label}</span>
          </div>
        );
      })}
    </div>
  );
};

const Phone = ({ children, dark }) => (
  <IOSDevice width={390} height={844} dark={!!dark} title="">

);

const App = () => (
  <DesignCanvas title="مجلس — Auth Flow" subtitle="Splash · Login · Signup (4 steps) · Success">
    <DCSection id="auth" title="تدفق المصادقة · Auth flow">
      <DCArtboard id="splash" label="1 · Splash" width={390} height={844}><Phone dark><SplashScreen/></Phone></DCArtboard>
      <DCArtboard id="login" label="2 · Login" width={390} height={844}><Phone><LoginScreen/></Phone></DCArtboard>

      <DCArtboard id="s2" label="4 · Signup — البيانات الشخصية" width={390} height={844}><Phone><Signup2/></Phone></DCArtboard>
